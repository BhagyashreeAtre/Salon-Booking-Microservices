server:
  port: 5000

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: BOOKING-SERVICE
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**

            - id: PAYMENT-SERVICE
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            - id: CATEGORY-SERVICE
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/api/categories/**

            - id: SALON-SERVICE
              uri: lb://SALON-SERVICE
              predicates:
                - Path=/salons/**

            - id: SALON-SERVICE-API
              uri: lb://SALON-SERVICE
              predicates:
                - Path=/api/salons/**

            - id: SALON-ADMIN-SERVICE
              uri: lb://SALON-SERVICE
              predicates:
                - Path=/api/admin/salons/**

            - id: SERVICE-OFFERING
              uri: lb://SERVICE-OFFERING
              predicates:
                - Path=/api/service-offering/**

            - id: USER-SERVICE-AUTH
              uri: lb://USER-SERVICE
              predicates:
                - Path=/auth/**

            - id: USER-SERVICE-ADMIN
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/admin/users/**

            - id: USER-SERVICE-API
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: USER-SERVICE-USERS
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: NOTIFICATION-SERVICE
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/salon-booking/protocol/openid-connect/certs

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only