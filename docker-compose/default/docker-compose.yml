
services:
  # ==================== MYSQL DATABASES ====================

  userdb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: userdb_salon
    volumes:
      - userdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  bookingdb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: bookingdb_salon
    volumes:
      - bookingdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  categorydb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: categorydb_salon
    volumes:
      - categorydb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  paymentdb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: paymentdb_salon
    volumes:
      - paymentdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  salondb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: salondb_salon
    volumes:
      - salondb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  servicedb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: servicedb_salon
    volumes:
      - servicedb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shreeatre

  # ==================== EUREKA SERVER ====================

  eurekaserver:
    image: shreeatre/salon_eureka_server:v1
    ports:
      - "8070:8070"
    networks:
      - shreeatre
    # No healthcheck: the image has neither curl nor wget.

  # ==================== USER SERVICE ====================

  user-service:
    image: shreeatre/salon_user:v1
    ports:
      - "5001:5001"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/userdb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      userdb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== BOOKING SERVICE ====================

  booking-service:
    image: shreeatre/salon_booking_service:v1
    ports:
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://bookingdb:3306/bookingdb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      RABBITMQ_HOST: salon-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: salon_app
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      bookingdb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== CATEGORY SERVICE ====================

  category-service:
    image: shreeatre/salon_category_service:v1
    ports:
      - "5006:5006"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://categorydb:3306/categorydb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      categorydb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== PAYMENT SERVICE ====================

  payment-service:
    image: shreeatre/salon_payment:v1
    ports:
      - "5007:5007"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://paymentdb:3306/paymentdb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      paymentdb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== SALON SERVICE ====================

  salon-service:
    image: shreeatre/salon_salon_service:v1
    ports:
      - "5008:5008"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://salondb:3306/salondb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      salondb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== SERVICE OFFERING ====================

  service-offering:
    image: shreeatre/salon_service_offering:v1
    ports:
      - "5009:5009"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://servicedb:3306/servicedb_salon"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      servicedb:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

  # ==================== API GATEWAY ====================

  gateway-server:
    image: shreeatre/salon_gateway_server:v1
    ports:
      - "5000:5000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eurekaserver:
        condition: service_started
    networks:
      - shreeatre

# ==================== VOLUMES ====================

volumes:
  userdb_data:
  bookingdb_data:
  categorydb_data:
  paymentdb_data:
  salondb_data:
  servicedb_data:

# ==================== NETWORK ====================

networks:
  shreeatre:
    driver: bridge
